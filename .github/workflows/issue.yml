name: Notificar Discord ao Criar Issue ou Discussão

on:
  issues:
    types: [opened]
  discussion:
    types: [created]

permissions: {}

jobs:
  discord_notification_on_issue_or_discussion:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Notify Discord on Issue or Discussion
        shell: bash
        env:
          DISCORD_WEBHOOK_URL_ISSUES: ${{ secrets.DISCORD_WEBHOOK_URL_ISSUES }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          DISC_AUTHOR: ${{ github.event.discussion.user.login }}
          DISC_TITLE: ${{ github.event.discussion.title }}
          DISC_URL: ${{ github.event.discussion.html_url }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "issues" ]; then
            AUTHOR="$ISSUE_AUTHOR"; TITLE="$ISSUE_TITLE"; URL="$ISSUE_URL"
            TYPE="Issue"; ICON="📋"
          else
            AUTHOR="$DISC_AUTHOR"; TITLE="$DISC_TITLE"; URL="$DISC_URL"
            TYPE="Discussão"; ICON="💬"
          fi

          # O link deve apontar para o próprio GitHub; caso contrário, é descartado
          case "$URL" in
            https://github.com/*) ;;
            *) URL="" ;;
          esac

          PAYLOAD=$(jq -n \
            --arg icon "$ICON" \
            --arg type "$TYPE" \
            --arg author "$AUTHOR" \
            --arg title "$TITLE" \
            --arg url "$URL" \
            '
            # Sanitiza texto controlado pelo usuário:
            # - troca caracteres de controle e invisíveis/bidi por espaço
            # - substitui qualquer URL (esquema://...) por "[link removido]"
            # - troca crases para não escapar do bloco de código
            # - colapsa espaços/quebras de linha e limita a 200 caracteres
            def sanitize:
              gsub("[\u0000-\u001f\u007f\u200b-\u200f\u202a-\u202e\u2066-\u2069\ufeff]"; " ")
              | gsub("[A-Za-z][A-Za-z0-9+.-]*://[^\\s]*"; "[link removido]")
              | gsub("`"; "'"'"'")
              | gsub("\\s+"; " ")
              | .[:200];
            # Título e autor vão dentro de código inline: o Discord não renderiza markdown nem links ali
            {
              content: "\($icon) **Nova \($type) Criada \($icon)**\n- Autor: `\($author | sanitize)`\n- Título: `\($title | sanitize)`\n- Link: \(if $url == "" then "indisponível" else "<" + $url + ">" end)",
              allowed_mentions: { parse: [] }
            }')

          curl -X POST -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL_ISSUES"
