name: Notificar Discord ao Criar Issue ou Discussão

# Define em quais situações esse workflow será executado
on:
  issues:
    types:
      - opened
  discussion:
    types:
      - created

permissions:
  issues: read
  discussions: read

# Os jobs são conjuntos de actions que são executados na mesma máquina virtual.
# É possível ter mais de um job e assim executar ações paralelamente.
jobs:
  discord_notification_on_issue_or_discussion:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord on Issue or Discussion
        env:
          DISCORD_WEBHOOK_URL_ISSUES: ${{ secrets.DISCORD_WEBHOOK_URL_ISSUES }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          DISCUSSION_AUTHOR: ${{ github.event.discussion.user.login }}
          DISCUSSION_TITLE: ${{ github.event.discussion.title }}
          DISCUSSION_URL: ${{ github.event.discussion.html_url }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "issues" ]; then
            AUTHOR="$ISSUE_AUTHOR"
            TITLE="$ISSUE_TITLE"
            URL="$ISSUE_URL"
            TYPE="Issue"
            ICON="📋"
          else
            AUTHOR="$DISCUSSION_AUTHOR"
            TITLE="$DISCUSSION_TITLE"
            URL="$DISCUSSION_URL"
            TYPE="Discussão"
            ICON="💬"
          fi

          TITLE=$(echo "$TITLE" | tr -d '\n\r')
          AUTHOR=$(echo "$AUTHOR" | tr -d '\n\r')
          URL=$(echo "$URL" | tr -d '\n\r')

          PAYLOAD=$(jq -n \
            --arg icon "$ICON" \
            --arg type "$TYPE" \
            --arg author "$AUTHOR" \
            --arg title "$TITLE" \
            --arg url "$URL" \
            '{content: "\($icon) **Nova \($type) Criada \($icon)**\n- Autor: \($author)\n- Título: \($title)\n- Link: \($url)"}'
          )

          curl -X POST -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL_ISSUES"
        shell: bash