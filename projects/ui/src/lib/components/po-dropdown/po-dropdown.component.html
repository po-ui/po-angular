<div
  #dropdownRef
  class="po-dropdown"
  [attr.disabled]="disabled"
  tabindex="{{ disabled ? -1 : 0 }}"
  (click)="toggleDropdown()"
  (keydown)="onKeyDown($event)"
>
  <div
    class="po-dropdown-button"
    [ngClass]="{ 'po-dropdown-button-disabled': disabled, 'po-dropdown-button-open': open }"
  >
    <span>{{ label }}</span>
    <po-icon class="po-dropdown-icon" [p-icon]="icon"></po-icon>
  </div>
</div>

<po-popup
  #popupRef
  p-hide-arrow
  p-is-corner-align
  [p-position]="position"
  [p-actions]="actions"
  [p-custom-positions]="popupCustomPositions"
  [p-size]="size"
  [p-target]="dropdownRef"
  (p-close)="onPopupClose()"
  (p-click-item)="clickItem.emit($event)"
  (p-sub-items-load)="subItemsLoad.emit($event)"
>
</po-popup>
