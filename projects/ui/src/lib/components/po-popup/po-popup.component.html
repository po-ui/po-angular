@if (showPopup && (actions.length || rootLazyLoad) && !checkAllActionIsInvisible()) {
  <div #popupRef class="po-popup">
    @if (!hideArrow) {
      <div class="po-popup-arrow po-arrow-{{ arrowDirection }}"></div>
    }
    <div class="po-popup-container">
      <po-listbox
        #listbox
        #poListBoxRef
        p-type="action"
        [p-items]="actions"
        [p-param]="param"
        [p-size]="size"
        [p-listbox-subitems]="computedListboxSubitems"
        [p-root-lazy-load]="rootLazyLoad"
        (p-close)="close($event)"
        (p-click-item)="onClickItem($event)"
        (p-sub-items-load)="subItemsLoad.emit($event)"
        (p-root-items-load)="rootItemsLoad.emit()"
      >
        <ng-content p-popup-header-template select="[p-popup-header-template]"></ng-content>
      </po-listbox>
    </div>
  </div>
}
