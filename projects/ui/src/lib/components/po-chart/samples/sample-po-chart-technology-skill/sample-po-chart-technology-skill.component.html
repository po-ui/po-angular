<div class="po-row">
  <po-widget class="po-md-6">
    <po-chart
      p-title="Technology Skill Assessment"
      [p-categories]="radarConfig"
      [p-type]="type"
      [p-series]="series"
    >
    </po-chart>
  </po-widget>

  <po-widget class="po-md-6">
    <po-chart
      p-title="Genre Popularity"
      p-type="radar"
      [p-categories]="radarConfigMovies"
      [p-series]="seriesMovies"
      [p-options]="radarOptions"
    >
    </po-chart>
  </po-widget>
</div>
