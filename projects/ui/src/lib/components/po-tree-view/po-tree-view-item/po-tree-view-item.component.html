<po-tree-view-item-content
  [p-components-size]="componentsSize()"
  [p-item]="item()"
  [p-level]="level()"
  [p-selectable]="selectable()"
  [p-single-select]="singleSelect()"
  [p-selected-value]="selectedValue()"
  (p-expanded)="onClick()"
  (p-selected)="onSelect(item())"
  (p-activated)="onActivate($event)"
>
</po-tree-view-item-content>

@if (hasSubItems) {
  <ul class="po-tree-view-item-group" role="group">
    @if (item().expanded) {
      <div (animate.enter)="animateEnter($event)" (animate.leave)="animateLeave($event)">
        @for (subItem of item().subItems; track trackByFunction($index)) {
          <li
            po-tree-view-item
            class="po-tree-view-item"
            [p-components-size]="componentsSize()"
            [p-item]="subItem"
            [p-level]="level() + 1"
            [p-selectable]="selectable()"
            [p-single-select]="singleSelect()"
            [p-selected-value]="selectedValue()"
          ></li>
        }
      </div>
    }
  </ul>
}
