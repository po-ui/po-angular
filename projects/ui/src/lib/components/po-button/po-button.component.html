<button
  #button
  class="po-button"
  [type]="type()"
  [attr.p-kind]="kind"
  [attr.p-danger]="danger"
  [disabled]="disabled || loading"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-expanded]="ariaExpanded"
  [attr.tabindex]="tabindex"
  (blur)="onBlur()"
  (click)="onClick()"
>
  @if (loading) {
    <div class="po-button-loading-icon">
      <po-loading-icon [p-size]="mapSizeToIcon(size)"></po-loading-icon>
    </div>
  }

  <div class="po-button-container">
    @if (icon()) {
      <po-icon class="po-button-icon" [p-icon]="icon()"></po-icon>
    }
    @if (label()) {
      <span class="po-button-label">{{ label() }}</span>
    }
  </div>

  @if (isGlow()) {
    <span class="po-button-glow-halo" aria-hidden="true">
      @for (dot of glowTrail; track dot) {
        <i class="po-button-glow-dot"></i>
      }
    </span>
    <span class="po-button-glow-ring" aria-hidden="true">
      @for (dot of glowTrail; track dot) {
        <i class="po-button-glow-dot"></i>
      }
    </span>
  }
</button>
