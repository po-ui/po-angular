<div class="home-banner-content">
  <div class="po-row">
    <div class="po-offset-lg-1 po-offset-xl-2 po-lg-10 po-xl-8">
      <h1 class="title">PO UI</h1>
      <p class="library">Biblioteca de componentes baseado em Angular</p>
      <po-button
        class="star"
        p-icon="ICON_STAR"
        p-label="Star {{ stargazers_count }}"
        p-kind="glow"
        p-size="large"
        (p-click)="openExternalLink('https://github.com/po-ui/po-angular/stargazers')"
      >
      </po-button>
    </div>
  </div>
</div>
