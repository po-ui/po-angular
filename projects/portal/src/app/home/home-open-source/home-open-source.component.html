<section class="home-open-source">
  <!-- Decoration: E-5, po_white.svg (250x250 viewBox) with low opacity -->
  <img
    class="home-open-source-logo home-open-source-logo-left"
    src="./assets/po-logos/po_white.svg"
    alt=""
    aria-hidden="true"
  />
  <img
    class="home-open-source-logo home-open-source-logo-right"
    src="./assets/po-logos/po_white.svg"
    alt=""
    aria-hidden="true"
  />

  <div class="home-open-source-content">
    <h2 class="home-open-source-title">
      <span>100%</span>&ngsp;<span class="home-open-source-accent">Código</span>&ngsp;<span>Aberto</span>
    </h2>
    <p class="home-open-source-text">
      O PO UI é feito por desenvolvedores para desenvolvedores. Nosso código é aberto, transparente e em constante
      evolução. Contribua com melhorias, tire dúvidas e faça parte da nossa comunidade.
    </p>
    <po-button
      class="home-open-source-button"
      p-label="Quero contribuir"
      p-kind="primary"
      p-size="large"
      (p-click)="openExternalLink('https://github.com/po-ui')"
    >
    </po-button>
  </div>
</section>
