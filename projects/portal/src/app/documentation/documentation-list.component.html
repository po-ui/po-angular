<po-page-list p-title="API Reference" [p-filter]="filter">
  <po-list-view
    p-tag-position="right"
    p-detail-display="inline"
    [p-field-properties]="fieldProperties"
    [p-actions]="listActions"
    [p-items]="filteredItems"
    (p-title-action)="viewSample($event)"
  >
    <ng-template p-list-view-detail-template let-item>
      @if (item.preview) {
        <div [innerHtml]="item.preview | markdown: { disableSanitizer: true } | async"></div>
      }
    </ng-template>
  </po-list-view>
</po-page-list>
