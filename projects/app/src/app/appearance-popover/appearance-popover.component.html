<!-- Botão que abre o popover de aparência -->
<div #appearanceTarget class="appearance-popover-trigger">
  <po-button p-label="Aparência" p-icon="po-icon-settings" (p-click)="openPopover()"></po-button>
</div>

<po-popover #popover [p-target]="appearanceTarget" p-title="Aparência" p-trigger="function">
  <div class="appearance-popover">
    <!-- Tema -->
    <span class="po-font-text-bold">Tema</span>
    <div class="po-mt-1 po-mb-2">
      <po-radio-group
        name="themePopover"
        [p-options]="themeOptions"
        [ngModel]="selectedTheme"
        (p-change)="onThemeChange($event)"
      ></po-radio-group>
    </div>

    <po-divider></po-divider>

    <!-- Modo (Light / Dark) -->
    <div class="po-mt-2 po-mb-2">
      <span class="po-font-text-bold">Modo</span>
      <div class="po-row po-mt-1">
        <po-button
          class="po-mr-1"
          p-label="Claro"
          [p-kind]="selectedMode === 'light' ? 'primary' : 'secondary'"
          (p-click)="onModeChange('light')"
        ></po-button>
        <po-button
          p-label="Escuro"
          [p-kind]="selectedMode === 'dark' ? 'primary' : 'secondary'"
          (p-click)="onModeChange('dark')"
        ></po-button>
      </div>
    </div>

    <po-divider></po-divider>

    <!-- Densidade / Acessibilidade (AA / AAA) -->
    <div class="po-mt-2 po-mb-2">
      <span class="po-font-text-bold">Densidade / Acessibilidade</span>
      <div class="po-row po-mt-1">
        <po-button
          class="po-mr-1"
          p-label="Compacto (AA)"
          [p-kind]="selectedA11y === 'AA' ? 'primary' : 'secondary'"
          (p-click)="onA11yChange('AA')"
        ></po-button>
        <po-button
          p-label="Espaçoso (AAA)"
          [p-kind]="selectedA11y === 'AAA' ? 'primary' : 'secondary'"
          (p-click)="onA11yChange('AAA')"
        ></po-button>
      </div>
    </div>
  </div>
</po-popover>
